name: YeniAsya
description: "Yeni Asya Mobil Uygulaması"
publish_to: 'none'

version: 2.9.1+21

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.1
  provider: ^6.0.5
  font_awesome_flutter: ^10.6.0
  http: ^1.2.1 
  bcrypt: ^1.1.3
  crypto: ^3.0.3
  fluttertoast: ^8.2.4
  shared_preferences: ^2.2.2
  http_parser: ^4.0.2
  syncfusion_flutter_pdfviewer: ^31.2.15
  pdfx: ^2.6.0
  webview_flutter: ^4.4.2
  webview_flutter_web: ^0.2.2
  file_picker: ^8.1.2
  path: ^1.9.0
  firebase_core: ^3.7.0
  firebase_auth: ^5.3.2
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3
  firebase_messaging: ^15.1.3
  share_plus: ^7.2.1
  url_launcher: ^6.3.1
