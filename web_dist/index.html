<!DOCTYPE html>
<html>
  <head>
    <base href="/">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Yeni Asya Web">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yeni Asya Dijital | E-Gazete / E-Dergi / E-Kitap</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #ffffff;
      }

      body {
        font-family: "Segoe UI", Arial, sans-serif;
      }

      #bootstrap-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at top, rgba(183, 28, 28, 0.08), transparent 48%),
          #ffffff;
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      #bootstrap-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .bootstrap-shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 32px;
        text-align: center;
      }

      .bootstrap-logo {
        width: 96px;
        height: 96px;
        padding: 16px;
        border-radius: 26px;
        background: #fbeaea;
        border: 1px solid #ecc0c0;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
      }

      .bootstrap-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .bootstrap-title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #101010;
      }

      .bootstrap-status {
        font-size: 14px;
        font-weight: 500;
        color: #6d6d6d;
      }

      .bootstrap-spinner {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 2.5px solid #f0cfcf;
        border-top-color: #b71c1c;
        animation: bootstrap-spin 900ms linear infinite;
      }

      @keyframes bootstrap-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      (function () {
        var migrationKey = "ya-web-cache-migration-20260316-1";
        var bootstrapSrc = "flutter_bootstrap.js?v=20260316-1";

        function injectBootstrapScript() {
          var script = document.createElement("script");
          script.src = bootstrapSrc;
          script.async = true;
          document.body.appendChild(script);
        }

        async function refreshFlutterServiceWorker() {
          if (!("serviceWorker" in navigator)) return;
          try {
            var registration = await navigator.serviceWorker.getRegistration();
            if (!registration) return;
            await registration.update();
            if (registration.waiting) {
              registration.waiting.postMessage("skipWaiting");
            }
          } catch (error) {
            console.warn("Flutter service worker update skipped:", error);
          }
        }

        async function prepareFlutterBootstrap() {
          if ("serviceWorker" in navigator) {
            var refreshing = false;
            navigator.serviceWorker.addEventListener("controllerchange", function () {
              if (refreshing) return;
              refreshing = true;
              window.location.reload();
            });

            try {
              if (!window.localStorage.getItem(migrationKey)) {
                var registrations = await navigator.serviceWorker.getRegistrations();
                if (registrations.length > 0) {
                  await Promise.all(
                    registrations.map(function (registration) {
                      return registration.unregister();
                    })
                  );
                  if ("caches" in window) {
                    var cacheKeys = await caches.keys();
                    await Promise.all(
                      cacheKeys
                        .filter(function (key) {
                          return key.indexOf("flutter-") === 0;
                        })
                        .map(function (key) {
                          return caches.delete(key);
                        })
                    );
                  }
                  window.localStorage.setItem(migrationKey, "done");
                  window.location.reload();
                  return;
                }
                window.localStorage.setItem(migrationKey, "done");
              }
            } catch (error) {
              console.warn("Flutter cache migration skipped:", error);
            }
          }

          injectBootstrapScript();
          window.setTimeout(refreshFlutterServiceWorker, 2500);
        }

        window.__prepareFlutterBootstrap = prepareFlutterBootstrap;
      })();

      window.addEventListener("flutter-first-frame", function () {
        var loader = document.getElementById("bootstrap-loader");
        if (!loader) return;
        loader.classList.add("hidden");
        window.setTimeout(function () {
          loader.remove();
        }, 260);
      });
    </script>
  </head>

  <body style="background-color: white; margin: 0;">
    <div id="bootstrap-loader" aria-live="polite" aria-busy="true">
      <div class="bootstrap-shell">
        <div class="bootstrap-logo">
          <img
            src="assets/assets/images/logo.png"
            alt="Yeni Asya Dijital"
            width="64"
            height="64"
            loading="eager"
            onerror="if (!this.dataset.fallbackTried) { this.dataset.fallbackTried = '1'; this.src = 'assets/images/logo.png'; }"
          />
        </div>
        <div class="bootstrap-title">Yeni Asya Dijital</div>
        <div class="bootstrap-status">Uygulama hazırlanıyor</div>
        <div class="bootstrap-spinner" aria-hidden="true"></div>
      </div>
    </div>
    <script>
      window.__prepareFlutterBootstrap();
    </script>
  </body>
</html>
