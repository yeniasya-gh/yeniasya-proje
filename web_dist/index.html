<!DOCTYPE html>
<html>
  <head>
    <base href="/">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Yeni Asya Web">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yeni Asya Dijital | E-Gazete / E-Dergi / E-Kitap</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #ffffff;
      }

      body {
        font-family: "Segoe UI", Arial, sans-serif;
      }

      #bootstrap-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at top, rgba(183, 28, 28, 0.08), transparent 48%),
          #ffffff;
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      #bootstrap-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .bootstrap-shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 32px;
        text-align: center;
      }

      .bootstrap-logo {
        width: 96px;
        height: 96px;
        padding: 16px;
        border-radius: 26px;
        background: #fbeaea;
        border: 1px solid #ecc0c0;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
      }

      .bootstrap-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .bootstrap-title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #101010;
      }

      .bootstrap-status {
        font-size: 14px;
        font-weight: 500;
        color: #6d6d6d;
      }

      .bootstrap-spinner {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 2.5px solid #f0cfcf;
        border-top-color: #b71c1c;
        animation: bootstrap-spin 900ms linear infinite;
      }

      @keyframes bootstrap-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>
    <script>
      if (window.pdfjsLib) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.worker.min.js";
      }

      window.addEventListener("flutter-first-frame", function () {
        var loader = document.getElementById("bootstrap-loader");
        if (!loader) return;
        loader.classList.add("hidden");
        window.setTimeout(function () {
          loader.remove();
        }, 260);
      });
    </script>
  </head>

  <body style="background-color: white; margin: 0;">
    <div id="bootstrap-loader" aria-live="polite" aria-busy="true">
        <div class="bootstrap-shell">
          <div class="bootstrap-logo">
            <img src="assets/images/logo.png" alt="Yeni Asya Dijital" />
          </div>
        <div class="bootstrap-title">Yeni Asya Dijital</div>
        <div class="bootstrap-status">Uygulama hazırlanıyor</div>
        <div class="bootstrap-spinner" aria-hidden="true"></div>
      </div>
    </div>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
